services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 2s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot
      DATA_DIR: /data
      # used only by pytest
      TEST_ADMIN_DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot
      TEST_DATABASE_URL: postgresql://copilot:copilot@db:5432/copilot_test
    volumes:
      - ./data:/data:ro
      - ./eval_results:/app/eval_results
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
